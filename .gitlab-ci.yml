---
###############################################################################
# GRAPHQL MODULE PIPELINE
###############################################################################

include:
  - project: 'inuits/gitlab-ci/pipeline-templates'
    file: 'pipelines/applications/graphql-module-pipeline.yml'
    ref: 'v4.20.0'

# A `beta/<name>` branch publishes <version>-<name>.<pipeline iid> under the
# `beta-<name>` dist-tag; clients opt in with "base-graphql": "beta-<name>".
# `latest` stays master-only.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^beta\//'

build-job:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-beta-job:
  extends: build-job
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^beta\//'
  script:
    - echo //nexus.inuits.io/repository/:_authToken=${NPM_CONFIG__AUTH_TOKEN} > ~/.npmrc
    - npm install -g pnpm@${PNPM_VERSION}
    - BASE_VERSION=$(node -p "require('./package.json').version")
    - npm version --no-git-tag-version "${BASE_VERSION}-${CI_COMMIT_REF_SLUG#beta-}.${CI_PIPELINE_IID}"
    - mkdir -p ./generated-types
    - pnpm exec graphql-codegen --config codegen.ci.ts
    - pnpm build
    - pnpm publish --tag "${CI_COMMIT_REF_SLUG}" --no-git-checks
